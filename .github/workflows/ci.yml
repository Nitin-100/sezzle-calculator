name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs so a moved tag cannot change what runs.
# Dependabot keeps the pins up to date.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.27 patch, the same as the golang:1.27 Docker image, so
          # standard library security fixes are picked up without a change here.
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce coverage of internal packages (90 percent)
        run: |
          go test -coverprofile=internal.out ./internal/... > /dev/null
          total=$(go tool cover -func=internal.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 90) }'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Test with coverage thresholds
        run: npm run coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} -t calculator:ci .
      - name: Smoke test the running container
        run: |
          docker run -d --name calc -p 8080:8080 calculator:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/readyz && break; sleep 1; done
          curl -fs localhost:8080/healthz | grep -q '"version":"ci"'
          curl -fs -X POST localhost:8080/api/v1/add -H 'Content-Type: application/json' -d '{"a":2,"b":3}' | grep -q '"result":5'
          curl -fs localhost:8080/ | grep -q 'id="root"'
          test "$(docker inspect --format '{{.Config.User}}' calculator:ci)" = "nonroot:nonroot"
      - name: Show container logs on failure
        if: failure()
        run: docker logs calc
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: calculator:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
